<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CallGear CRM Storybook</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
    <link rel="stylesheet" href="./src/styles.css?v=20260608-swipe-actions-fix" />
  </head>
  <body>
    <div id="app"></div>
    <svg class="svg-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <filter id="glass-lens-filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
        <feComponentTransfer in="SourceAlpha" result="alpha">
          <feFuncA type="identity" />
        </feComponentTransfer>
        <feGaussianBlur in="alpha" stdDeviation="18" result="blur" />
        <feDisplacementMap in="SourceGraphic" in2="blur" scale="16" xChannelSelector="A" yChannelSelector="A" />
      </filter>
    </svg>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
    <script type="module" src="./src/app.js?v=20260608-swipe-actions-fix"></script>
  </body>
</html>
